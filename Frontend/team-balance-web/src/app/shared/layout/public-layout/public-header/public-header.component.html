<header class="tb-header">
  <div class="tb-container tb-header__inner">
    <a routerLink="/" fragment="top" (click)="closeMenu()" class="tb-brand" aria-label="TeamBalance, inicio">
      @if (contrastMode()) {
        <img class="tb-brand__image tb-brand__image--contrast" src="/brand/teambalance-logo-header-contrast.png" alt="TeamBalance" />
      } @else {
        <img class="tb-brand__image" src="/brand/teambalance-logo-header.png" alt="TeamBalance" />
      }
    </a>

    <nav class="tb-nav" aria-label="Navegación principal">
      <a routerLink="/" fragment="top" (click)="closeMenu()" routerLinkActive="tb-nav__link--active" [routerLinkActiveOptions]="{ exact: true }" class="tb-nav__link">Inicio</a>
      <a routerLink="/plans" (click)="closeMenu()" routerLinkActive="tb-nav__link--active" class="tb-nav__link">Planes</a>
      <a routerLink="/about-us" (click)="closeMenu()" routerLinkActive="tb-nav__link--active" class="tb-nav__link">Nosotros</a>
      <a routerLink="/contact" (click)="closeMenu()" routerLinkActive="tb-nav__link--active" class="tb-nav__link">Contacto</a>
    </nav>

    <div class="tb-header__actions">
      <a routerLink="/signin" class="tb-login">  {{ 'signin' | appTranslatePipe: localization.language() }}</a>
      <a routerLink="/plans" class="tb-button tb-button--primary">  {{ 'view-plans' | appTranslatePipe: localization.language() }}</a>
      <app-language-selector></app-language-selector>
    </div>

    <button type="button" class="tb-menu-button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-navigation">
      <span class="sr-only">Abrir menú</span>
      @if (menuOpen()) {
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      } @else {
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      }
    </button>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-navigation" class="tb-mobile-nav" aria-label="Navegación móvil">
      <div class="tb-container">
        <div class="tb-mobile-nav__links">
          <a routerLink="/" fragment="top" (click)="closeMenu()" routerLinkActive="tb-nav__link--active" [routerLinkActiveOptions]="{ exact: true }" class="tb-nav__link">Inicio</a>
          <a routerLink="/plans" (click)="closeMenu()" routerLinkActive="tb-nav__link--active" class="tb-nav__link">Planes</a>
          <a routerLink="/about-us" (click)="closeMenu()" routerLinkActive="tb-nav__link--active" class="tb-nav__link">Nosotros</a>
          <a routerLink="/contact" (click)="closeMenu()" routerLinkActive="tb-nav__link--active" class="tb-nav__link">Contacto</a>
        </div>
        <div class="tb-mobile-nav__actions">
          <a routerLink="/signin" (click)="closeMenu()" class="tb-button tb-button--secondary">Iniciar sesión</a>
          <a routerLink="/plans" (click)="closeMenu()" class="tb-button tb-button--primary">Ver planes</a>
        </div>
      </div>
    </nav>
  }
</header>
