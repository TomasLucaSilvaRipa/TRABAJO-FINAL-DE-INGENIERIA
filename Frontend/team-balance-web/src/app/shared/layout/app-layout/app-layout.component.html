<div class="min-h-screen xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="flex-1 transition-all duration-300 ease-in-out"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <app-header/>
    <!-- app header end -->
    <main class="team-balance-workspace p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

@if (foco.activo()) {
  <section class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950 p-6 text-center text-white">
    <div class="w-full max-w-xl rounded-3xl border border-cyan-500/50 bg-slate-900 p-8 shadow-2xl">
      <p class="tb-page-kicker">MODO FOCO ACTIVO</p>
      <h2 class="mt-2 text-2xl font-bold">{{foco.tarea()?.titulo}}</h2>
      <p class="mt-3 text-sm text-slate-300">La navegación queda pausada mientras trabajás en esta tarea.</p>
      <p class="my-8 font-mono text-6xl font-bold tracking-wider text-cyan-300">{{foco.formatoDuracion()}}</p>
      <button class="tb-action-button" type="button" (click)="detenerFoco()">Detener y preparar carga de horas</button>
      <p class="mt-4 text-xs text-slate-400">La duración se precarga en el registro de horas para que la revises y confirmes.</p>
    </div>
  </section>
}
