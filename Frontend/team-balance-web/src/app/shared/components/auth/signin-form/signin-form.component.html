
<section class="tb-auth-form" aria-labelledby="signin-title">
  <a class="tb-auth-form__back" routerLink="/">
    <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m12.5 4.5-5 5 5 5" /></svg>
    Volver al inicio
  </a>

  <div class="tb-auth-form__heading">
    <p class="tb-auth-form__eyebrow">Acceso a la plataforma</p>
    <h1 id="signin-title">Bienvenido nuevamente.</h1>
    <p>Ingresá con tus credenciales para continuar gestionando tu equipo.</p>
  </div>

  <form class="tb-auth-form__fields" (ngSubmit)="onSignIn()">
    <div class="tb-auth-field">
      <label for="signin-email">Email laboral</label>
      <input id="signin-email" type="email" name="email" [(ngModel)]="email" autocomplete="email" placeholder="nombre@agencia.com" required />
    </div>

    <div class="tb-auth-field">
      <label for="signin-password">Contraseña</label>
      <div class="tb-auth-password">
        <input id="signin-password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" autocomplete="current-password" placeholder="Ingresá tu contraseña" required />
        <button type="button" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          @if (showPassword) {
            <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M2.7 10s2.4-4.1 7.3-4.1S17.3 10 17.3 10 14.9 14.1 10 14.1 2.7 10 2.7 10Z" /><circle cx="10" cy="10" r="2.2" /></svg>
          } @else {
            <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m3.3 3.3 13.4 13.4M7.5 5.9A8.9 8.9 0 0 1 10 5.5c4.9 0 7.3 4.5 7.3 4.5a12 12 0 0 1-2.6 2.8M12.1 14.1a7.8 7.8 0 0 1-2.1.3c-4.9 0-7.3-4.4-7.3-4.4a11.7 11.7 0 0 1 2.8-3" /><path d="M8.7 8.7a2.2 2.2 0 0 0 2.6 2.6" /></svg>
          }
        </button>
      </div>
    </div>

    <div class="tb-auth-form__options">
      <label class="tb-auth-check"><input type="checkbox" name="remember" [(ngModel)]="isChecked" /><span>Mantener sesión iniciada</span></label>
      <a routerLink="/contact">¿Necesitás ayuda?</a>
    </div>

    <button class="tb-auth-submit" type="submit">Iniciar sesión</button>
  </form>

  <div class="tb-auth-form__alternate">
    <span>¿Querés empezar a usar TeamBalance?</span>
    <a routerLink="/plans">Elegí tu plan</a>
  </div>
</section>
