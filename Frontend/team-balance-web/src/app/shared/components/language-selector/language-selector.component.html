<div class="tb-language-selector" [class.tb-language-selector--compact]="compact()" [class.tb-language-selector--dark]="variant() === 'dark'" (keydown.escape)="cerrar()">
  <button type="button" class="tb-language-selector__trigger" [attr.aria-expanded]="abierto()" aria-haspopup="listbox" (click)="alternar()">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M16 14l4 7m-4-7l-4 7"/></svg>
    <span>{{ etiquetaIdioma() }}</span>
    <svg class="tb-language-selector__chevron" [class.tb-language-selector__chevron--open]="abierto()" aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
  </button>
  @if (abierto()) {
    <div class="tb-language-selector__menu" role="listbox">
      @for (idioma of localization.idiomasDisponibles(); track idioma.codigo) {
        <button type="button" role="option" [attr.aria-selected]="localization.language() === idioma.codigo" (click)="cambiarIdioma(idioma.codigo)"><span>{{ idioma.codigo.toUpperCase() }}</span> {{ idioma.nombre }}</button>
      }
    </div>
  }
</div>
