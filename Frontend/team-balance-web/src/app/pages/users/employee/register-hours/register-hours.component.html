<section class="mx-auto max-w-4xl space-y-6">
  <header>
    <p class="text-sm font-semibold uppercase tracking-[0.18em] text-cyan-600">Mi operación</p>
    <h1 class="mt-2 text-3xl font-bold text-slate-900 dark:text-white">Registrar horas</h1>
    <p class="mt-2 text-slate-600 dark:text-slate-300">Informá el tiempo dedicado a una tarea para mantener actualizada la carga operativa.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="registrar()" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <div class="grid gap-5 md:grid-cols-2">
      <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200">Tarea
        <input formControlName="tarea" placeholder="Seleccioná o ingresá una tarea" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5 text-slate-900 outline-none focus:border-cyan-500 dark:border-slate-600 dark:bg-slate-800 dark:text-white" />
      </label>
      <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200">Fecha
        <input type="date" formControlName="fecha" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5 text-slate-900 outline-none focus:border-cyan-500 dark:border-slate-600 dark:bg-slate-800 dark:text-white" />
      </label>
      <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200">Horas
        <input type="number" min="0.25" step="0.25" formControlName="horas" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5 text-slate-900 outline-none focus:border-cyan-500 dark:border-slate-600 dark:bg-slate-800 dark:text-white" />
      </label>
      <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200">Descripción opcional
        <input formControlName="descripcion" placeholder="Ej.: revisión de entregable" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5 text-slate-900 outline-none focus:border-cyan-500 dark:border-slate-600 dark:bg-slate-800 dark:text-white" />
      </label>
    </div>
    <div class="mt-6 flex items-center gap-4">
      <button type="submit" class="rounded-xl bg-cyan-600 px-5 py-2.5 text-sm font-bold text-white transition hover:bg-cyan-700">Guardar registro</button>
      @if (enviado) { <p class="text-sm font-medium text-emerald-600">El registro quedó listo para integrarse con la gestión de tareas.</p> }
    </div>
  </form>
</section>
