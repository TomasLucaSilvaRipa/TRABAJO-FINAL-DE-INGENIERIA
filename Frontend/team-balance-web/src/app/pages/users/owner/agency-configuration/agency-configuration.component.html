<section class="tb-workspace space-y-6">
  <header><p class="tb-page-kicker">CONFIGURACIÓN</p><h1 class="tb-page-title">Datos de la agencia</h1><p class="tb-page-description">Mantené actualizada la información institucional que identifica a tu agencia en TeamBalance.</p></header>
  <div class="grid gap-6 xl:grid-cols-[minmax(0,1fr)_320px]">
    <form class="tb-panel grid gap-5 md:grid-cols-2" aria-label="Configuración de la agencia">
      <div class="md:col-span-2"><label class="tb-field-label" for="nombre-comercial">Nombre comercial</label><input id="nombre-comercial" type="text" placeholder="Nombre de tu agencia" /></div>
      <div><label class="tb-field-label" for="razon-social">Razón social</label><input id="razon-social" type="text" placeholder="Razón social" /></div>
      <div><label class="tb-field-label" for="cuit">CUIT</label><input id="cuit" type="text" inputmode="numeric" placeholder="00-00000000-0" /></div>
      <div><label class="tb-field-label" for="condicion-fiscal">Condición fiscal</label><select id="condicion-fiscal"><option value="">Seleccionar condición</option><option>Responsable inscripto</option><option>Monotributo</option><option>Exento</option></select></div>
      <div><label class="tb-field-label" for="email-facturacion">Email de facturación</label><input id="email-facturacion" type="email" placeholder="facturacion@agencia.com" /></div>
      <div><label class="tb-field-label" for="telefono-contacto">Teléfono de contacto</label><input id="telefono-contacto" type="tel" placeholder="Código de país y número" /></div>
      <div class="flex items-end md:col-span-2"><button class="tb-action-button" type="button">Guardar cambios</button></div>
    </form>
    <aside class="tb-panel--navy"><p class="tb-page-kicker text-cyan-200">ORGANIZACIÓN</p><h2 class="mt-2 text-xl font-semibold text-white">Una base ordenada para operar</h2><p class="mt-3 text-sm leading-6 text-slate-200">Estos datos se usan como referencia institucional en las gestiones administrativas de TeamBalance.</p></aside>
  </div>
</section>
