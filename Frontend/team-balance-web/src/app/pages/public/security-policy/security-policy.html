<section class="tb-page-hero tb-page-hero--navy">
  <div class="tb-container tb-legal">
    <p class="tb-eyebrow">{{ content().eyebrow }}</p>
    <h1 class="tb-title">{{ content().title }}</h1>
    <p class="tb-lead">{{ content().lead }}</p>
  </div>
</section>

<article class="tb-section tb-section--legal">
  <div class="tb-container tb-legal">
    @for (section of content().sections; track section.title) {
      <section class="tb-legal__section">
        <h2>{{ section.title }}</h2>
        @for (paragraph of section.paragraphs; track paragraph) {
          <p>{{ paragraph }}</p>
        }
      </section>
    }

    <aside class="tb-legal__notice">{{ content().notice }}</aside>
  </div>
</article>
