<section class="bg-slate-50 py-24">

  <div class="mx-auto max-w-7xl px-6 lg:px-8">

    <div class="mb-14 max-w-2xl">
      <p class="font-semibold text-cyan-600">
        Contacto
      </p>

      <h1 class="mt-3 text-5xl font-bold text-slate-950">
        Hablemos sobre tu equipo
      </h1>

      <p class="mt-5 text-lg text-slate-600">
        Completá el formulario y nuestro equipo se pondrá en contacto
        con vos.
      </p>
    </div>

    <div class="grid gap-14 lg:grid-cols-2">

      <div>
        <h2 class="text-2xl font-semibold">
          ¿En qué podemos ayudarte?
        </h2>

        <p class="mt-4 max-w-md leading-7 text-slate-600">
          Podés comunicarte con nosotros para consultas comerciales,
          información sobre TeamBalance o asistencia general.
        </p>
      </div>

      <form
        class="rounded-2xl border border-slate-200 bg-white
               p-8 shadow-sm"
      >

        <div class="mb-5">
          <label class="mb-2 block text-sm font-medium">
            Nombre
          </label>

          <input
            type="text"
            class="w-full rounded-lg border border-slate-300
                   px-4 py-3 outline-none focus:border-cyan-500"
          />
        </div>

        <div class="mb-5">
          <label class="mb-2 block text-sm font-medium">
            Correo electrónico
          </label>

          <input
            type="email"
            class="w-full rounded-lg border border-slate-300
                   px-4 py-3 outline-none focus:border-cyan-500"
          />
        </div>

        <div class="mb-6">
          <label class="mb-2 block text-sm font-medium">
            Mensaje
          </label>

          <textarea
            rows="6"
            class="w-full resize-none rounded-lg border border-slate-300
                   px-4 py-3 outline-none focus:border-cyan-500"
          ></textarea>
        </div>

        <button
          type="button"
          class="w-full rounded-lg bg-cyan-600 px-5 py-3
                 font-semibold text-white hover:bg-cyan-700"
        >
          Enviar consulta
        </button>

      </form>

    </div>

  </div>

</section>
