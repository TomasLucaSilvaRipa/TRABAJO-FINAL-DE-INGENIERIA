<app-auth-page-layout>
  <section class="tb-auth-form" aria-labelledby="reset-password-title">
    <a class="tb-auth-form__back" routerLink="/signin">
      <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m12.5 4.5-5 5 5 5" /></svg>
      Volver a iniciar sesión
    </a>

    <div class="tb-auth-form__heading">
      <p class="tb-auth-form__eyebrow">Nueva contraseña</p>
      <h1 id="reset-password-title">Protegé nuevamente tu acceso.</h1>
      <p>Elegí una contraseña de al menos 8 caracteres, con letras y números.</p>
    </div>

    @if (responseMessage()) {
      <div class="tb-auth-status tb-auth-status--success" role="status">
        <p>{{ responseMessage() }}</p>
        <a class="tb-auth-submit tb-auth-submit--link" routerLink="/signin">Iniciar sesión</a>
      </div>
    } @else {
      <form class="tb-auth-form__fields" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="tb-auth-field">
          <label for="reset-password">Nueva contraseña</label>
          <input id="reset-password" type="password" formControlName="password" autocomplete="new-password" placeholder="Ingresá una contraseña segura" />
        </div>

        <div class="tb-auth-field">
          <label for="reset-repeat-password">Repetir nueva contraseña</label>
          <input id="reset-repeat-password" type="password" formControlName="repetirPassword" autocomplete="new-password" placeholder="Repetí la contraseña" />
        </div>

        @if (requestError()) {
          <p class="tb-auth-request-error" role="alert">{{ requestError() }}</p>
        }

        <button class="tb-auth-submit" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Restableciendo…' : 'Restablecer contraseña' }}
        </button>
      </form>
    }
  </section>
</app-auth-page-layout>
