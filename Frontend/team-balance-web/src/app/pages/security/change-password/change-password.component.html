<app-page-breadcrumb pageTitle="Seguridad de la cuenta" />

<div class="mx-auto max-w-2xl rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">
  <div class="mb-6">
    <p class="text-sm font-semibold uppercase tracking-[0.14em] text-cyan-600 dark:text-cyan-300">Mi cuenta</p>
    <h2 class="mt-2 text-xl font-semibold text-gray-900 dark:text-white">Cambiar contraseña</h2>
    <p class="mt-2 text-sm leading-6 text-gray-600 dark:text-gray-400">Al confirmar el cambio, se cerrarán las sesiones activas y tendrás que iniciar sesión nuevamente.</p>
  </div>

  @if (responseMessage()) {
    <div class="rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800 dark:border-emerald-500/30 dark:bg-emerald-500/10 dark:text-emerald-200" role="status">
      <p>{{ responseMessage() }}</p>
      <a routerLink="/signin" class="mt-3 inline-flex font-semibold underline underline-offset-4">Ir a iniciar sesión</a>
    </div>
  } @else {
    <form class="space-y-5" [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" novalidate>
      <div>
        <label for="current-password" class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Contraseña actual</label>
        <input id="current-password" type="password" formControlName="passwordActual" autocomplete="current-password" class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-900 outline-none transition focus:border-cyan-500 focus:ring-3 focus:ring-cyan-500/15 dark:border-gray-700 dark:text-white" />
      </div>

      <div>
        <label for="new-password" class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Nueva contraseña</label>
        <input id="new-password" type="password" formControlName="password" autocomplete="new-password" class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-900 outline-none transition focus:border-cyan-500 focus:ring-3 focus:ring-cyan-500/15 dark:border-gray-700 dark:text-white" />
      </div>

      <div>
        <label for="repeat-password" class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Repetir nueva contraseña</label>
        <input id="repeat-password" type="password" formControlName="repetirPassword" autocomplete="new-password" class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-900 outline-none transition focus:border-cyan-500 focus:ring-3 focus:ring-cyan-500/15 dark:border-gray-700 dark:text-white" />
      </div>

      @if (requestError()) {
        <p class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-200" role="alert">{{ requestError() }}</p>
      }

      <button type="submit" [disabled]="submitting()" class="inline-flex h-11 items-center justify-center rounded-lg bg-cyan-600 px-5 text-sm font-semibold text-white transition hover:bg-cyan-700 disabled:cursor-not-allowed disabled:opacity-70">
        {{ submitting() ? 'Actualizando…' : 'Actualizar contraseña' }}
      </button>
    </form>
  }
</div>
